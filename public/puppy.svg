  <ellipse cx="50" cy="68" rx="16" ry="12" fill="#fbdcb6"/>
  <!-- eyes -->
  <circle cx="39" cy="50" r="4" fill="#1a1614"/>
  <circle cx="61" cy="50" r="4" fill="#1a1614"/>
  <!-- eye highlights -->
  <circle cx="40.5" cy="48.5" r="1.3" fill="#ffffff"/>
  <circle cx="62.5" cy="48.5" r="1.3" fill="#ffffff"/>
  <!-- nose -->
