<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- floppy ears (behind head) -->
  <ellipse cx="22" cy="46" rx="12" ry="22" fill="#b56a35" transform="rotate(-18 22 46)"/>
  <ellipse cx="78" cy="46" rx="12" ry="22" fill="#b56a35" transform="rotate(18 78 46)"/>
  <!-- head -->
  <circle cx="50" cy="55" r="30" fill="#f4a261"/>
