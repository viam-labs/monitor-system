name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: tar -czf app.tar.gz build meta.json

      - name: Strip v prefix from tag
        run: echo "MOD_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - uses: viamrobotics/upload-module@v1
        with:
          module-path: app.tar.gz
          platform: any
          version: ${{ env.MOD_VERSION }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_value }}
